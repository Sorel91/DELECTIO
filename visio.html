<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DELECTIO Visio | Zoom</title>
  <meta name="description" content="Salle visio integree DELECTIO pour les cours Zoom.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7ff;
      --surface: #ffffff;
      --text: #19213a;
      --muted: #5f6785;
      --line: #dbe2ff;
      --primary: #3a66ff;
      --primary-strong: #2f4fd1;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f7f9ff 0%, #f3f6ff 100%);
    }

    .shell {
      width: min(1200px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1rem 0 1.5rem;
      display: grid;
      gap: 0.9rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .brand {
      text-decoration: none;
      color: #1b2b70;
      font-weight: 800;
    }

    .course {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 0.6rem 0.85rem;
      text-decoration: none;
      font-weight: 700;
      color: var(--text);
      background: #fff;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      background: var(--primary-strong);
      border-color: var(--primary-strong);
    }

    .stage {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      min-height: 76vh;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 76vh;
      border: 0;
      display: block;
    }

    .notice {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--line);
      display: none;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .overlay.show {
      display: flex;
    }

    @media (max-width: 720px) {
      iframe,
      .stage {
        min-height: 70vh;
        height: 70vh;
      }

      .btn {
        width: 100%;
      }

      .actions {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="espace.html">DELECTIO Math</a>
      <div class="course" id="course-name">Salle visio</div>
      <div class="actions">
        <a class="btn" href="espace.html">Retour espace</a>
        <a class="btn btn-primary" id="open-external" href="#" target="_blank" rel="noopener noreferrer">Ouvrir Zoom externe</a>
      </div>
    </header>

    <p class="notice">
      Zoom est charge dans DELECTIO. Si la visio ne s'affiche pas, utilisez le bouton "Ouvrir Zoom externe".
    </p>

    <section class="stage">
      <iframe id="zoom-frame" title="Zoom dans DELECTIO" allow="camera; microphone; fullscreen; display-capture"></iframe>
      <div class="overlay" id="fallback-overlay">
        <span>Zoom bloque parfois l'affichage integre selon la configuration de la reunion.</span>
        <a class="btn btn-primary" id="fallback-open" href="#" target="_blank" rel="noopener noreferrer">Continuer dans Zoom</a>
      </div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawZoomUrl = params.get('zoom') || '';
    const course = params.get('course') || 'Salle visio';

    const courseName = document.querySelector('#course-name');
    const frame = document.querySelector('#zoom-frame');
    const openExternal = document.querySelector('#open-external');
    const fallbackOpen = document.querySelector('#fallback-open');
    const fallbackOverlay = document.querySelector('#fallback-overlay');

    courseName.textContent = course;

    const isValidZoomUrl = /^https:\/\/(?:[a-z0-9-]+\.)?zoom\.us\//i.test(rawZoomUrl);

    if (!isValidZoomUrl) {
      fallbackOverlay.classList.add('show');
      openExternal.removeAttribute('href');
      fallbackOpen.removeAttribute('href');
      fallbackOverlay.querySelector('span').textContent = 'Lien Zoom invalide. Retournez dans l\'espace enseignant pour le corriger.';
    } else {
      frame.src = rawZoomUrl;
      openExternal.href = rawZoomUrl;
      fallbackOpen.href = rawZoomUrl;

      // Affiche le fallback apres un court delai: certains comptes Zoom refusent l'embed iframe.
      window.setTimeout(() => {
        fallbackOverlay.classList.add('show');
      }, 2500);
    }
  </script>
</body>
</html>
